[project]
name = "dhruvasetu-agents"
version = "0.1.0"
description = "DhruvaSetu AI Agents Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.130",
    "chromadb",
    "networkx",
    "pypdf",
    "python-docx",
    "pillow",
    "pytesseract",
    "pdf2image",
    "pandas",
    "openpyxl",
    "tweepy",
    "python-dotenv",
    "supabase>=2",
    "httpx",
    "fastapi",
    "uvicorn[standard]"
]

[tool.vercel]
entrypoint = "api:app"
